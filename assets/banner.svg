<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1420"/>
      <stop offset="55%" stop-color="#0f2233"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2de2e6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2de2e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#123047"/>
      <stop offset="100%" stop-color="#0a1c2b"/>
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a9e8ff"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2de2e6"/>
      <stop offset="100%" stop-color="#4dff91"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bgGrad)"/>

  <!-- circuitry background -->
  <g stroke="#1c3a52" stroke-width="2" fill="none" opacity="0.6">
    <path d="M0,60 H160 V120 H320"/>
    <path d="M0,300 H120 V250 H260 V300 H400"/>
    <path d="M60,0 V40 H220 V90"/>
    <path d="M980,0 V50 H1120 V10"/>
    <path d="M1200,90 H1050 V150 H900"/>
    <path d="M1200,260 H1060 V210 H930 V260 H820"/>
  </g>
  <g fill="#2de2e6" opacity="0.7">
    <circle cx="160" cy="60" r="4"/>
    <circle cx="320" cy="120" r="4"/>
    <circle cx="220" cy="40" r="4"/>
    <circle cx="1120" cy="50" r="4"/>
    <circle cx="900" cy="150" r="4"/>
    <circle cx="820" cy="260" r="4"/>
  </g>

  <!-- glow behind gauge -->
  <circle cx="960" cy="185" r="220" fill="url(#glowCyan)"/>

  <!-- speed sweep lines -->
  <g stroke="#2de2e6" stroke-width="2" opacity="0.35">
    <line x1="40" y1="330" x2="220" y2="330"/>
    <line x1="10" y1="340" x2="150" y2="340"/>
    <line x1="60" y1="350" x2="260" y2="350"/>
  </g>

  <!-- gauge dial -->
  <g transform="translate(960,185)">
    <circle r="130" fill="url(#dialGrad)" stroke="#2de2e6" stroke-width="3" opacity="0.95"/>
    <circle r="130" fill="none" stroke="#0a1c2b" stroke-width="1"/>
    <!-- ticks -->
    <g stroke="#4dd9e0" stroke-width="3">
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(-120)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(-90)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(-60)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(-30)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(0)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(30)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(60)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(90)"/>
      <line x1="0" y1="-118" x2="0" y2="-100" transform="rotate(120)"/>
    </g>
    <!-- needle -->
    <g transform="rotate(35)">
      <polygon points="0,-8 96,0 0,8" fill="url(#needleGrad)"/>
    </g>
    <circle r="12" fill="#0f2233" stroke="#ff8a3d" stroke-width="3"/>
    <!-- inner arc progress -->
    <path d="M -92,46 A 100,100 0 0 1 60,-84" fill="none" stroke="#4dff91" stroke-width="6" opacity="0.85"/>
  </g>

  <!-- performance bars decoration lower right -->
  <g transform="translate(760,290)">
    <rect x="0" y="0" width="60" height="10" rx="4" fill="url(#barGrad)"/>
    <rect x="70" y="0" width="90" height="10" rx="4" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="170" y="0" width="40" height="10" rx="4" fill="url(#barGrad)" opacity="0.6"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700" fill="url(#textGlow)" textLength="760" lengthAdjust="spacingAndGlyphs">
    System Optimizer Pro
  </text>

  <!-- tagline -->
  <text x="60" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#bcd7e6" textLength="900" lengthAdjust="spacingAndGlyphs">
    <tspan x="60" dy="0">Optimize system performance by cleaning junk files,</tspan>
  </text>
  <text x="60" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="24" fill="#bcd7e6" textLength="740" lengthAdjust="spacingAndGlyphs">
    <tspan x="60" dy="0">managing startup apps, and boosting speed.</tspan>
  </text>

  <!-- underline accent -->
  <rect x="60" y="270" width="180" height="4" rx="2" fill="#2de2e6"/>
</svg>